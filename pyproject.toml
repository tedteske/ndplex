[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ndplex"
dynamic = ["version"]
description = "The n-Dimensional m-Plex array: a generic Pascal's array (rectangle, cube or higher) with user-defined edges and node-generating function."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ted Teske" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23.5",
]
keywords = [
    "pascal's triangle", "pascal's array", "combinatorics", "binomial",
    "multinomial", "simplex", "integer sequences", "oeis", "numpy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/tedteske/ndplex"
Source = "https://github.com/tedteske/ndplex"
Issues = "https://github.com/tedteske/ndplex/issues"
Changelog = "https://github.com/tedteske/ndplex/blob/master/CHANGELOG.md"

[dependency-groups]
test = ["pytest>=7"]

[tool.hatch.version]
path = "src/ndplex/__init__.py"

# Recent hatchling writes Core Metadata 2.5 (PEP 794); 2.4 (PEP 639 license
# fields) is all this package needs, as in bounded-lognorm.
[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = [
    "src/ndplex",
    "tests",
    "docs",
    "README.md",
    "CHANGELOG.md",
    "ATTRIBUTION.md",
    "CITATION.cff",
    "LICENSE",
]

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["src/ndplex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
